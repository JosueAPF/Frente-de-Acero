<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frente de Acero – Mechas por turnos</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#12161b;--panel:#1b222a;--line:#2d3844;--tx:#e4e9ee;--mut:#8a98a6;--me:#f2a93b;--foe:#e0485a;--ok:#3fb7a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Chakra Petch","Bahnschrift","Segoe UI",sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;margin:0;letter-spacing:.04em;flex:1}
#turn{font-weight:700;color:var(--me)}#turn.foe{color:var(--foe)}
button{font:inherit;background:var(--me);color:#1a1205;border:0;border-radius:3px;padding:8px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.35;cursor:default}button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
#stage{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#info{position:absolute;left:10px;top:10px;background:rgba(18,22,27,.86);border:1px solid var(--line);padding:8px 12px;font-size:.85rem;max-width:230px;line-height:1.45}
#info b{color:var(--me)}
#log{position:absolute;right:10px;bottom:10px;max-width:min(320px,55%);font-size:.78rem;color:var(--mut);text-align:right;pointer-events:none;line-height:1.4}
#log div:last-child{color:var(--tx)}
#info{pointer-events:none}
#itembar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:62%;z-index:3}
.it{position:relative;width:48px;height:48px;padding:3px;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--rc,var(--line))}
.it img{width:100%;height:100%;object-fit:contain;display:block}
.it i{position:absolute;right:2px;bottom:1px;font:700 .68rem "Chakra Petch",sans-serif;color:var(--tx);background:rgba(0,0,0,.75);padding:0 3px}
.it[data-r=common]{--rc:#8a98a6}.it[data-r=uncommon]{--rc:#3fb7a6}.it[data-r=rare]{--rc:#4f9dff}.it[data-r=epic]{--rc:#b07cff}.it[data-r=legendary]{--rc:#f2a93b}
.it:disabled{opacity:.35}
#itembar .tip{background:rgba(18,22,27,.92);border:1px solid var(--me);padding:6px 10px;font-size:.8rem}
details{margin:8px 0}summary{cursor:pointer;color:var(--me);font-size:.9rem}
input[type=text],textarea{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:3px;font:inherit;padding:6px;width:100%}
input[type=text]{width:60%}
.tabs.wrap{flex-wrap:wrap}.tabs.wrap button{flex:1 0 22%;font-size:.8rem}
.pgrid{display:grid;gap:1px;margin:10px 0}
.pc{aspect-ratio:1;padding:0;min-width:0;overflow:hidden;font-size:.58rem;font-weight:700;background:#242d36;color:var(--tx);border:0;border-radius:0}
.pc.m{background:#7a5a1c}.pc.e{background:#8a2a38}.pc.pm{background:#8a98a6;color:#12161b}.pc.pe{background:#b0505d}.pc.sel{outline:2px solid #fff;outline-offset:-2px}
.item{display:flex;gap:10px;align-items:center}.item img{width:44px;height:44px;flex:none}.item em{display:block;font-style:normal;font-size:.72rem}
.pt{position:relative}.mi{position:absolute;right:-3px;top:-3px;width:15px;height:15px}
.chip .bar.en{height:3px}.chip .bar.en i{background:#d6b04a}
#stage.hp #info,#stage.hp #log{display:none}
header button{padding:6px 10px}
footer{display:flex;gap:8px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;width:134px;height:40px;background:var(--bg);color:var(--tx);border:1px solid var(--line);text-align:left;font-weight:500;font-size:.74rem;padding:2px 8px 2px 2px;scroll-snap-align:start}
footer{scroll-snap-type:x proximity;scrollbar-width:thin}
footer.many .chip{width:114px;gap:5px;padding-right:5px}
.pt{flex:0 0 auto;width:34px;height:34px;background:#0b0e12 center/cover no-repeat;border:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--tc,var(--me))}
.ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{display:flex;justify-content:space-between;gap:4px;line-height:1.1}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm em{font-style:normal;color:var(--mut);font-size:.64rem}
.chip .bar{display:block;margin:0;height:5px}
.chip.sel{border-color:var(--me)}.chip.sel .pt{border-color:var(--me)}.chip.done{opacity:.45}.chip.dead{opacity:.2}.chip.dead .pt{filter:grayscale(1)}
.bar{height:5px;background:#000;margin-top:5px}.bar i{display:block;height:100%;background:var(--ok)}
#ov{position:absolute;inset:0;background:rgba(10,13,17,.96);z-index:5;overflow:auto;display:flex;padding:16px}
#ov.hide{display:none}
#card{margin:auto;width:100%;max-width:540px}
#card h2{font-size:1.9rem;margin:0 0 6px;letter-spacing:.02em}
#card p{color:var(--mut);margin:0 0 16px;line-height:1.5}
.mode{display:block;width:100%;text-align:left;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;font-weight:500}
.mode b{display:block;color:var(--me);font-size:1.05rem;margin-bottom:2px}.mode span{color:var(--mut);font-size:.85rem;font-weight:500}
.mode:hover{border-color:var(--me)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:.92rem}
.row>span{min-width:2.2em;text-align:right;color:var(--me)}
select,input[type=range]{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:3px;font:inherit;padding:6px}
input[type=range]{flex:1;padding:0;accent-color:var(--me)}input[type=color]{width:56px;height:32px;border:1px solid var(--line);background:var(--panel);padding:2px}
small{display:block;color:var(--mut);margin:-4px 0 6px;font-size:.75rem}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px 0;background:var(--panel);color:var(--mut);border:1px solid var(--line)}
.tabs button.on{border-color:var(--me);color:var(--tx)}.tabs button.act{color:var(--me)}
.acts{display:flex;gap:10px;margin-top:18px}.acts button:last-child{flex:1}
#bud{margin:10px 0 0;color:var(--ok);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header><h1>FRENTE DE ACERO</h1><span id="turn"></span><button id="menuBtn" class="ghost">Menú</button><button id="infoBtn" class="ghost" title="Mostrar u ocultar los textos sobre el campo">Info</button><button id="buildBtn" class="ghost" style="display:none">Construir</button><button id="end" class="ghost">Terminar turno</button></header>
  <div id="stage">
    <div id="info"></div>
    <div id="log"></div>
    <div id="itembar"></div>
    <div id="ov"><div id="card"></div></div>
  </div>
  <footer id="chips"></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let W=12,H=9;const BUD=16;
const WEAP={canon:'Cañón',laser:'Láser',ametra:'Ametralladora',misil:'Misiles'};
const TYPES={
 Explorador:{hp:60,mv:5,rng:2,dmg:15,r:.24,w:'ametra'},
 Asalto:{hp:100,mv:3,rng:3,dmg:25,r:.3,w:'canon'},
 Francotirador:{hp:70,mv:2,rng:6,dmg:35,r:.24,w:'laser'},
 Pesado:{hp:160,mv:2,rng:2,dmg:30,r:.38,w:'canon'},
 Artillero:{hp:75,mv:1,rng:5,dmg:30,r:.3,w:'misil'}};
const NAMES=Object.keys(TYPES);
const COL={me:0xf2a93b,foe:0xe0485a};
const $=id=>document.getElementById(id);
const rnd=n=>(Math.random()*n)|0;
let BINV=null,SBX={},TD={wall:1,mud:1,mine:1,rep:1,tp:1},FOG=false,scanT=0,kills=0,lastReward=0,dropsLog=[],tmode=null,RAID=false,res=0,bases=[],RSV=new Set(),CAP=0,PS=.5,insp=null,pil=[],extras={me:0,foe:0},units=[],sel=null,busy=false,over=false,turnN=1,playerTurn=true,moveMap=new Map(),targets=[],lastBuild=null,inGame=false;
const key=(x,y)=>x+','+y;
const at=(x,y)=>units.find(u=>u.alive&&u.x===x&&u.y===y);
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const wx=x=>x-W/2+.5, wy=y=>H/2-.5-y;

/* ---------- three.js (vista ortogonal 2D) ---------- */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x12161b);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,50);cam.position.z=10;
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);
  const a=w/h,hh=Math.max(H/2+.4,(W/2+.4)/a),hw=hh*a;
  cam.left=-hw;cam.right=hw;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix();
}
addEventListener('resize',resize);
const tiles=[],tileGeo=new THREE.PlaneGeometry(.94,.94),terr=new Map();
const TBASE={wall:0x2a323b,mud:0x4a3a28,rep:0x1d4d3a,tp:0x1f2a3a},TPC=[0x7af0ff,0xc58bff,0xffd166];
function buildBoard(){
  tiles.forEach(m=>{scene.remove(m);m.material.dispose()});tiles.length=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const m=new THREE.Mesh(tileGeo,new THREE.MeshBasicMaterial());m.position.set(wx(x),wy(y),0);scene.add(m);tiles.push(m)}
}
const flat=(w,h,c,x,y,z,g)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c}));m.position.set(wx(x),wy(y),z);g.add(m)};
function decorate(){
  terr.forEach((t,k)=>{
    const [x,y]=k.split(',').map(Number),g=new THREE.Group();t.deco=g;scene.add(g);
    if(t.t==='wall'){flat(.84,.84,0x5c6773,x,y,.02,g);flat(.6,.6,0x6f7b88,x,y,.03,g)}
    else if(t.t==='rep'){flat(.46,.12,0x5fe0a0,x,y,.02,g);flat(.12,.46,0x5fe0a0,x,y,.02,g)}
    else if(t.t==='mine'){const m=new THREE.Mesh(new THREE.CircleGeometry(.17,14),new THREE.MeshBasicMaterial({color:0xe0485a}));m.position.set(wx(x),wy(y),.02);g.add(m);flat(.08,.08,0x12161b,x,y,.03,g)}
    else if(t.t==='tp'){const m=new THREE.Mesh(new THREE.RingGeometry(.16,.3,20),new THREE.MeshBasicMaterial({color:TPC[t.id%3]}));m.position.set(wx(x),wy(y),.02);g.add(m)}
    else if(t.t==='ore'){const m=new THREE.Mesh(new THREE.PlaneGeometry(.3,.3),new THREE.MeshBasicMaterial({color:t.own?0x5fe0a0:0xd6b04a}));m.rotation.z=Math.PI/4;m.position.set(wx(x),wy(y),.02);g.add(m);t.m=m}
  });
}
function paint(){
  tiles.forEach((m,i)=>{
    const x=i%W,y=(i/W)|0,k=key(x,y),t=terr.get(k);let c=t&&TBASE[t.t]||((x+y)%2?0x1f272f:0x242d36);
    if(moveMap.has(k))c=0x1f6b68;
    if(sel&&sel.x===x&&sel.y===y)c=0x7a5a1c;
    if(insp&&insp.x===x&&insp.y===y)c=0x3a4a5e;
    if(pil.some(u=>u.x===x&&u.y===y))c=0x6b6a2a;
    if(targets.some(u=>u.x===x&&u.y===y))c=0x8a2a38;
    m.material.color.setHex(c);
  });
}
/* ---------- sprites (atlas 6 columnas x 5 filas: 5 vistas + explosión) ---------- */
const ATLM={"cw": 140, "ch": 143, "gy": 39},ATL={n:null,g:null},S0=.0112;
const IMG=new Image();
IMG.onload=()=>{
  const cv=document.createElement('canvas');cv.width=IMG.width;cv.height=IMG.height;
  const cx=cv.getContext('2d');cx.drawImage(IMG,0,0);
  const id=cx.getImageData(0,0,cv.width,cv.height),d=id.data;
  for(let i=0;i<d.length;i+=4){const l=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)*.85;d[i]=d[i+1]=d[i+2]=l}
  cx.putImageData(id,0,0);
  ATL.n=new THREE.Texture(IMG);ATL.n.needsUpdate=true;ATL.g=new THREE.CanvasTexture(cv);
};

/* vista según la dirección: este=3/4 der., oeste=3/4 izq., sur=frente, norte=espalda; atk=perfil de disparo */
function face(u,dx,dy,atk){
  if(u.pilot){if(dx)u.body.scale.x=dx<0?-1:1;return}
  const h=Math.abs(dx)>=Math.abs(dy);let f=h?(dx>0?4:0):(dy>0?2:1),flip=false;
  if(atk&&h){f=3;flip=dx>0}
  u.body.material.map=u.team==='none'?ATL.g:ATL.n;u.body.material.needsUpdate=true;
  uvSet(u.body,u.row,f);u.body.scale.x=flip?-1:1;
}
async function explode(d){
  if(d.pilot){await tween(300,k=>d.mesh.scale.setScalar(1-k));scene.remove(d.mesh);return}
  d.ring.visible=d.bg.visible=d.fill.visible=false;
  d.body.material.map=ATL.n;d.body.material.needsUpdate=true;uvSet(d.body,d.row,5);d.body.scale.x=1;d.body.material.color.setScalar(1);
  await tween(500,k=>{d.body.material.opacity=1-k*k;d.body.scale.set(1+.3*k,1+.3*k,1)});
  scene.remove(d.mesh);
}

  u.c=new THREE.Color(P?(u.team==='me'?0xffffff:COL.foe):u.color||(u.team==='me'?COL.me:u.team==='foe'?COL.foe:0x8b949e));
  const ring=new THREE.Mesh(new THREE.RingGeometry(P?0.2:0.34,P?0.26:0.43,28),bm(u.c.clone()));

  sp.position.set(0,P?0.12:-.1+(ATLM.ch/2-ATLM.gy)*S,.03);
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(.7,.08),bm(0));bg.position.set(0,-.44,.08);
  const fill=new THREE.Mesh(new THREE.PlaneGeometry(.7,.08).translate(.35,0,0),bm(0x3fb7a6));fill.position.set(-.35,-.44,.09);
  bg.visible=fill.visible=u.team!=='none';

}

const BASE_STAT={acc:100,eva:0,def:0,red:0,init:5};
const INIT={Explorador:8,Asalto:5,Francotirador:4,Pesado:2,Artillero:3};

/* ---- perfil persistente con versión y migraciones ---- */
const SKEY='frente_de_acero_save',SAVE_V=1,MIGR=[];  // MIGR[n](d) migra de la versión n a n+1
const newProfile=()=>({v:SAVE_V,credits:1000,inv:{repair_kit:2,kinetic_shield:1,energy_cell:1,scanner:1,range_amp:1,chip_cerberus:1},eq:[null,null,null,null,null]});
function normalize(d){
  if(!d)return newProfile();
  for(let v=d.v|0;v<SAVE_V;v++)(MIGR[v]||(x=>x))(d);
  d.v=SAVE_V;d.credits=Math.max(0,+d.credits||0);
  const inv={};for(const [k,n] of Object.entries(d.inv||{}))if(ITEMS[k]&&n>0)inv[k]=n|0;d.inv=inv;
  const used={};d.eq=Array.from({length:5},(_,i)=>{const c=(d.eq||[])[i];if(!c||ITEMS[c]?.type!=='chip'||(used[c]||0)>=(inv[c]||0))return null;used[c]=(used[c]||0)+1;return c});
  return d;
}
function loadProfile(){let d=null;try{d=JSON.parse(localStorage.getItem(SKEY))}catch(e){}return normalize(d&&typeof d==='object'?d:null)}
function saveProfile(){try{localStorage.setItem(SKEY,JSON.stringify(PROFILE))}catch(e){}}
let PROFILE=loadProfile();
const have=id=>(BINV||PROFILE.inv)[id]||0;
const stock=id=>PROFILE.inv[id]||0;
const consumables=()=>Object.values(ITEMS).filter(i=>i.type==='consumable');
const chipIds=()=>Object.values(ITEMS).filter(i=>i.type==='chip').map(i=>i.id);
const chipAvail=(id,slot)=>stock(id)-PROFILE.eq.filter((c,j)=>c===id&&j!==slot).length;
const modsText=i=>Object.entries(i.mods||{}).map(([k,v])=>`${v>0?'+':''}${v}${k==='red'?'%':''} ${STAT_LABEL[k].replace('% ','')}`).join(', ')+(i.note?` · ${i.note}`:'');
function equip(slot,id){PROFILE.eq[slot]=id||null;saveProfile();menu('hangar')}
function buy(id){const i=ITEMS[id];if(!i||PROFILE.credits<i.price)return;PROFILE.credits-=i.price;PROFILE.inv[id]=stock(id)+1;saveProfile();menu('shop')}
const shopList=()=>Object.values(ITEMS).filter(i=>i.shop!==false).sort((a,b)=>a.price-b.price);
const _ic={};
function iconOf(id){
  if(ICONS[id])return ICONS[id];if(_ic[id])return _ic[id];
  const col=ITEMS[id]?.color||'#8a98a6',c=document.createElement('canvas');c.width=c.height=72;const x=c.getContext('2d');
  x.fillStyle=col;for(let i=0;i<7;i++){x.fillRect(8,12+i*8,7,4);x.fillRect(57,12+i*8,7,4);x.fillRect(12+i*8,6,4,7);x.fillRect(12+i*8,59,4,7)}
  x.fillStyle='#1b222a';x.fillRect(14,14,44,44);x.strokeStyle=col;x.lineWidth=3;x.strokeRect(14,14,44,44);
  x.globalAlpha=.8;x.fillStyle=col;x.fillRect(24,24,24,24);x.globalAlpha=1;x.fillStyle='#12161b';x.fillRect(31,31,10,10);
  return _ic[id]=c.toDataURL();
}

/* ---- estadísticas efectivas, estados y combate ---- */
function initUnit(u){
  if(u.def==null&&u.pilot)u.def=PIL.def;
  if(u.init==null)u.init=u.pilot?6:(INIT[u.name]??2+(u.mv||3));
  u.fx=u.fx||[];u.flags=u.flags||{};
  if(!u.pilot&&u.maxE==null){u.maxE=100;u.energy=u.en!=null?u.en:100}
  if(u.sh>0&&!u.fx.length)addStatus(u,'shield',{n:u.sh});
  (u.st0||[]).forEach(id=>{if(STATUS[id])addStatus(u,id,{n:1})});
  if(u.perm)u.fx.forEach(f=>{if(!STATUS[f.id].stack)f.turns=null});
}
function sv(u,k){
  let v=u[k]??BASE_STAT[k]??0;const m=ITEMS[u.chip]?.mods;if(m&&m[k])v+=m[k];
  for(const f of u.fx||[]){const S=STATUS[f.id];if(S&&S.mods&&S.mods[k])v+=S.mods[k]*(S.stack?f.n:1)}
  return k==='mv'||k==='rng'?Math.max(1,v):v;
}
const flagOf=(u,k)=>!!(ITEMS[u.chip]?.flags?.[k]||(u.fx||[]).some(f=>STATUS[f.id]?.flags?.[k]));
function addStatus(u,id,o={}){const S=STATUS[id],f=u.fx.find(x=>x.id===id);if(f){if(S.stack)f.n+=o.n||1;else f.turns=S.turns??null}else u.fx.push({id,n:o.n||1,turns:S.turns??null})}
function useCharge(u,id){const i=(u.fx||[]).findIndex(f=>f.id===id);if(i<0)return false;if(--u.fx[i].n<=0)u.fx.splice(i,1);return true}
function tickStatuses(team){
  units.filter(u=>u.alive&&u.team===team).forEach(u=>{
    const ended=[];u.fx=u.fx.filter(f=>{if(f.turns==null)return true;if(--f.turns>0)return true;ended.push(f.id);return false});
    ended.forEach(id=>(STATUS[id].onExpire||[]).forEach(e=>OPS[e.op]({u},e)));
  });
  if(team==='me'&&scanT>0)scanT--;
}
function startTurnFx(){
  units.filter(u=>u.alive&&u.team==='me').forEach(u=>{
    if(!u.pilot)u.energy=SBX.inf?u.maxE:Math.min(u.maxE,u.energy+ENERGY_REGEN);
    if(flagOf(u,'noAct')){u.acted=u.moved=true;log(`${u.name} está sobrecalentado y no actúa este turno.`)}
  });
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const chance=(a,d)=>clamp(sv(a,'acc')-sv(d,'eva')+clamp(sv(a,'init')-sv(d,'init'),-10,10),5,100);
const rollHit=(a,d)=>Math.random()*100<chance(a,d);
function mitigate(d,dmg){
  if(useCharge(d,'shield'))return{dmg:0,note:`El escudo cinético de ${d.name} anula el impacto.`};
  if(flagOf(d,'firstHitNull')&&!d.flags.nullUsed){d.flags.nullUsed=true;return{dmg:0,note:`El chip Aegis de ${d.name} anula el primer impacto.`}}
  return{dmg:Math.max(1,Math.round((dmg-sv(d,'def'))*(1-sv(d,'red')/100)))};
}
const VISION=u=>units.some(o=>o.alive&&o.team==='me'&&dist(o,u)<=VIS);
const isSeen=u=>!FOG||u.team==='me'||scanT>0||VISION(u);
function refreshFog(){units.forEach(u=>{if(u.mesh&&u.alive)u.mesh.visible=isSeen(u)})}
function lootDrop(a,d){
  if(SBX.on)return;
  if(!a||a.team!=='me'||d.team!=='foe')return;kills++;
  if(d.pilot||Math.random()>=DROP_RATE)return;
  const pool=Object.values(ITEMS).filter(i=>i.drop>0);let r=Math.random()*pool.reduce((t,i)=>t+i.drop,0);
  const it=pool.find(i=>(r-=i.drop)<0)||pool[0];PROFILE.inv[it.id]=stock(it.id)+1;saveProfile();dropsLog.push(it.name);log(`Botín: ${it.name}.`);
}

function whyNot(i,u){
  if(!SBX.unl&&have(i.id)<1)return 'Sin existencias';
  if(i.action&&u.acted)return 'El mecha ya actuó';
  if(!SBX.inf&&(i.energy||0)>u.energy)return `Energía insuficiente (${i.energy})`;
  for(const r of i.req||[]){const m=REQ[r](u);if(m)return m}
  return null;
}

/* ---------- reglas ---------- */
const D=[[1,0],[-1,0],[0,1],[0,-1]];
const isWall=(x,y)=>terr.get(key(x,y))?.t==='wall';
/* alcance con costes: lodo cuesta 2, teletransporte salta al anillo gemelo */
function reach(u){
  const best=new Map([[key(u.x,u.y),0]]),q=[{x:u.x,y:u.y,c:0,path:[]}],out=new Map();
  while(q.length){
    q.sort((a,b)=>a.c-b.c);const n=q.shift();
    if(n.c>best.get(key(n.x,n.y)))continue;
    if(n.path.length)out.set(key(n.x,n.y),n);
    for(const [dx,dy] of D){
      const x=n.x+dx,y=n.y+dy,k=key(x,y);
      if(x<0||y<0||x>=W||y>=H||isWall(x,y)||at(x,y))continue;
      const t=terr.get(k),c=n.c+(t&&t.t==='mud'?2:1);if(c>sv(u,'mv'))continue;
      let m={x,y,c,path:[...n.path,{x,y}]};
      if(t&&t.t==='tp'){
        const p=t.pair;if(at(p.x,p.y))continue;
        const o=out.get(k);if(!o||o.c>c)out.set(k,{x:p.x,y:p.y,c,path:[...m.path,{x:p.x,y:p.y,tp:1}]});
        continue;
      }
      const mk=key(m.x,m.y);if(c<(best.get(mk)??99)){best.set(mk,c);q.push(m)}
    }
  }
  const st=terr.get(key(u.x,u.y));
  if(st&&st.t==='tp'&&!at(st.pair.x,st.pair.y))out.set(key(st.pair.x,st.pair.y),{x:st.pair.x,y:st.pair.y,c:0,path:[{x:st.pair.x,y:st.pair.y,tp:1}]});
  [...out.entries()].forEach(([k,m])=>{const t=terr.get(k);if(t&&t.t==='tp'){const tk=key(t.pair.x,t.pair.y);if(tk!==key(u.x,u.y)&&!out.has(tk))out.set(tk,m)}});
  return out;
}
/* línea de tiro: los muros la bloquean; los misiles vuelan por encima */
function los(x1,y1,x2,y2){
  const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))*4;
  for(let i=1;i<n;i++){
    const x=Math.round(x1+(x2-x1)*i/n),y=Math.round(y1+(y2-y1)*i/n);
    if((x!==x2||y!==y2)&&(x!==x1||y!==y1)&&isWall(x,y))return false;
  }
  return true;
}
const canHit=(a,x,y,d)=>Math.abs(x-d.x)+Math.abs(y-d.y)<=sv(a,'rng')&&(a.weapon==='misil'||los(x,y,d.x,d.y));
function field(f){
  const m=new Map([[key(f.x,f.y),0]]),q=[[f.x,f.y]];
  for(let i=0;i<q.length;i++){const [x,y]=q[i],d=m.get(key(x,y));for(const [dx,dy] of D){const a=x+dx,b=y+dy,k=key(a,b);if(a<0||b<0||a>=W||b>=H||m.has(k)||isWall(a,b))continue;m.set(k,d+1);q.push([a,b])}}
  return m;
}
function genTerrain(free){
  const area=W*H;
  const ok=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!terr.has(key(x,y))&&!at(x,y)&&!RSV.has(key(x,y))&&(free||(x>=2&&x<W-2));
  const put=(t,n,blob)=>{for(let g=0;n>0&&g<600;g++){const x=rnd(W),y=rnd(H);for(let i=0;i<blob&&n>0;i++){const px=i?x+rnd(3)-1:x,py=i?y+rnd(3)-1:y;if(ok(px,py)){terr.set(key(px,py),{t});n--}}}};
  for(let tr=0;tr<25;tr++){
    terr.clear();put('wall',Math.round(area*(tr<20?.1:.03)*TD.wall),3);
    const seen=field(units[0]);if(units.every(u=>seen.has(key(u.x,u.y)))&&bases.every(b=>seen.has(key(b.x,b.y))))break;
  }
  put('mud',Math.round(area*.06*TD.mud),5);put('rep',Math.round(Math.max(2,Math.round(area/45))*TD.rep),1);put('mine',Math.round(area/35*TD.mine),1);if(RAID)put('ore',Math.round(area/38),1);
  for(let id=0;id<Math.round(((area>150?2:1)+(area>300?1:0))*TD.tp);id++)for(let g=0;g<300;g++){
    const ax=rnd(W),ay=rnd(H),bx=rnd(W),by=rnd(H);
    if(Math.abs(ax-bx)+Math.abs(ay-by)<Math.max(W,H)/2||!ok(ax,ay)||!ok(bx,by))continue;
    terr.set(key(ax,ay),{t:'tp',id,pair:{x:bx,y:by}});terr.set(key(bx,by),{t:'tp',id,pair:{x:ax,y:ay}});break;
  }
  RSV.forEach(k=>terr.set(k,{t:'base'}));
}

function applyPlacement(pl){
  const occ=new Set();
  units.forEach(u=>{const p=u.pk&&pl[u.pk];if(p&&p[0]>=0&&p[1]>=0&&p[0]<W&&p[1]<H&&!occ.has(key(p[0],p[1]))){u.x=p[0];u.y=p[1];u.man=true;occ.add(key(u.x,u.y))}});
  units.forEach(u=>{
    if(u.man)return;if(!occ.has(key(u.x,u.y))){occ.add(key(u.x,u.y));return}
    for(let r=1,f=false;r<W+H&&!f;r++)for(let dx=-r;dx<=r&&!f;dx++)for(let dy=-r;dy<=r&&!f;dy++){
      const x=u.x+dx,y=u.y+dy;
      if(Math.max(Math.abs(dx),Math.abs(dy))===r&&x>=0&&y>=0&&x<W&&y<H&&!occ.has(key(x,y))){u.x=x;u.y=y;occ.add(key(x,y));f=true}
    }
  });
}
function newGame(c){
  scene.children.filter(o=>o.isGroup).forEach(o=>scene.remove(o));
  const sz=c.size||{w:12,h:9};W=sz.w;H=sz.h;terr.clear();buildBoard();extras={me:0,foe:0};CAP=c.cap||0;PS=c.psurv??.5;insp=null;RAID=!!c.raid;res=RAID?c.raid.res:0;bases=[];RSV=new Set();FOG=!!c.fog;BINV=c.inv?{...c.inv}:null;SBX=c.sbx||{};TD=c.terr||{wall:1,mud:1,mine:1,rep:1,tp:1};scanT=0;kills=0;dropsLog=[];tmode=null;lastReward=0;units=[];sel=null;over=false;busy=false;turnN=1;playerTurn=true;moveMap=new Map();targets=[];inGame=true;
  $('log').innerHTML='';
  const rows=()=>[...Array(H).keys()].sort(()=>Math.random()-.5);
  const add=(s,team)=>units.push({...s,team,max:s.hp,alive:true,acted:false,moved:false,x:null,y:null});
  c.mine.forEach(s=>add(s,'me'));c.foes.forEach(s=>add(s,'foe'));(c.neutral||[]).forEach(s=>add(s,'none'));
  if(c.raid)placeRaid(c.raid);
  else if(c.free){
    units.forEach(u=>{
      for(let t=0;t<600;t++){
        const x=rnd(W),y=rnd(H),min=t<400?3:1;
        if(units.some(o=>o.x===x&&o.y===y)||units.some(o=>o.team!==u.team&&o.x!==null&&Math.abs(o.x-x)+Math.abs(o.y-y)<min))continue;
        u.x=x;u.y=y;break;
      }
    });
  }else{
    [['me',0],['foe',W-1]].forEach(([tm,cx])=>{const r=rows();units.filter(u=>u.team===tm).forEach((u,i)=>{u.x=cx+(tm==='me'?i%2:-(i%2));u.y=r[i]})});
    units.filter(u=>u.team==='none').forEach(u=>{for(let t=0;t<300;t++){const x=3+rnd(W-6),y=rnd(H);if(!units.some(o=>o.x===x&&o.y===y)){u.x=x;u.y=y;break}}});
  }
  if(c.place)applyPlacement(c.place);
  if(!c.sandbox){let mi=0;units.forEach(u=>{if(u.team==='me'&&!u.pilot){u.chip=PROFILE.eq[mi]||null;mi++}})}
  units.forEach(makeMech);
  genTerrain(c.free);decorate();bases.forEach(drawBase);resize();paint();ui();
  log(`Despliegue: ${c.mine.length} contra ${c.foes.length}.`);
}
async function moveTo(u,c){
  busy=true;moveMap=new Map();targets=[];paint();
  for(const p of c.path){
    const fx=u.mesh.position.x,fy=u.mesh.position.y,tx=wx(p.x),ty=wy(p.y);
    face(u,tx-fx,ty-fy);
    if(p.tp){await tween(150,k=>u.mesh.scale.setScalar(1-k));u.mesh.position.set(tx,ty,.1-ty*.002);await tween(150,k=>u.mesh.scale.setScalar(k))}
    else await tween(110,k=>{const yy=fy+(ty-fy)*k;u.mesh.position.set(fx+(tx-fx)*k,yy,.1-yy*.002)});
    u.x=p.x;u.y=p.y;
  }
  const t=terr.get(key(u.x,u.y));
  if(t&&t.t==='rep'&&u.hp<u.max){u.hp=Math.min(u.max,u.hp+30);u.fill.scale.x=u.hp/u.max;log(`${u.name} se repara.`)}
  else if(t&&t.t==='mine'){terr.delete(key(u.x,u.y));scene.remove(t.deco);await hit(null,u,30,' por una mina',{pierce:true})}
  if(RAID&&u.team==='me'&&u.alive){
    if(t&&t.t==='ore'&&!t.own){t.own='me';t.m.material.color.setHex(0x5fe0a0);res+=15;log('Conectaste un depósito (+15 y +10 por turno).')}
    const b=bases.find(b=>b.x===u.x&&b.y===u.y&&b.team==='foe');if(b)captureBase(b);
  }
  busy=false;
}
async function fire(a,d){
  const ax=a.mesh.position.x,ay=a.mesh.position.y+.25,dx=d.mesh.position.x,dy=d.mesh.position.y+.25;
  const col=a.team==='me'?0xffd27a:0xff8a96;
  const shot=(r,ms,delay=1)=>tween(delay,()=>{}).then(()=>{
    const b=new THREE.Mesh(new THREE.CircleGeometry(r,10),new THREE.MeshBasicMaterial({color:col}));scene.add(b);
    return tween(ms,k=>b.position.set(ax+(dx-ax)*k,ay+(dy-ay)*k,.3)).then(()=>scene.remove(b));
  });
  if(a.weapon==='laser'){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(Math.hypot(dx-ax,dy-ay),.07),new THREE.MeshBasicMaterial({color:0x7af0ff,transparent:true}));
    m.position.set((ax+dx)/2,(ay+dy)/2,.3);m.rotation.z=Math.atan2(dy-ay,dx-ax);scene.add(m);
    await tween(260,k=>m.material.opacity=1-k);scene.remove(m);
  }else if(a.weapon==='ametra')await Promise.all([1,90,180].map(t=>shot(.05,160,t)));
  else await shot(a.pilot?.05:a.weapon==='misil'?.14:.09,a.pilot?160:a.weapon==='misil'?420:230);
}
async function hit(a,d,dmg,tag='',fx={}){
  if(!fx.pierce){const r=mitigate(d,dmg);dmg=r.dmg;if(r.note)log(r.note);if(dmg<=0){await pulse(d,0x4f9dff);return}}
  d.hp=Math.max(0,d.hp-dmg);d.fill.scale.x=Math.max(.001,d.hp/d.max);
  log(a?`${a.team==='me'?'Tu':'Enemigo'} ${a.name} hace ${dmg} a ${d.name}${tag}.`:`${d.name} recibe ${dmg}${tag}.`);
  d.body.material.color.setHex(0xff6a6a);await tween(90,()=>{});shade(d);
  if(d.hp<=0){
    if(RAID&&a&&a.team==='me'&&d.team==='foe'){const g=d.pilot?8:25;res+=g;log(`+${g} recursos de recuperación.`)}
    if(a&&a.team==='me'&&d.team==='foe'&&!d.pilot&&!fx.noPilot&&extras.me<3&&Math.random()<CAP){
      extras.me++;d.team='me';d.hp=Math.ceil(d.max/2);d.fill.scale.x=d.hp/d.max;d.c=new THREE.Color(COL.me);face(d,1,0);d.acted=d.moved=true;shade(d);
      log(`¡Capturaste a ${d.name}! Vuelve con la mitad de blindaje.`);return;
    }
    d.alive=false;log(`${d.name} destruido.`);await explode(d);if(!d.pilot&&!fx.noPilot&&Math.random()<PS)spawnPilot(d);lootDrop(a,d)}
}
async function attack(a,d){
  busy=true;
  const fx0=d.mesh.position.x-a.mesh.position.x,fy0=d.mesh.position.y-a.mesh.position.y;
  const shots=useCharge(a,'dshot')?2:1;
  for(let i=0;i<shots&&d.alive;i++){
    face(a,fx0,fy0,true);await fire(a,d);face(a,fx0,fy0);
    if(!rollHit(a,d)){log(`${a.name} falla el disparo contra ${d.name}.`);continue}
    await hit(a,d,dmgOf(a,d));
    if(a.weapon==='misil')for(const o of units.filter(o=>o.alive&&o.team===d.team&&o!==d&&dist(o,d)===1))await hit(a,o,sv(a,'dmg')>>1,' (explosión)');
  }
  busy=false;
}

function pilotFace(col){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  x.fillStyle='#161c23';x.fillRect(0,0,64,64);
  x.fillStyle=col;x.beginPath();x.moveTo(8,64);x.quadraticCurveTo(10,46,32,44);x.quadraticCurveTo(54,46,56,64);x.fill();
  x.fillStyle='#d9b38c';x.beginPath();x.arc(32,30,13,0,7);x.fill();
  x.fillStyle=col;x.beginPath();x.arc(32,26,16,Math.PI,0);x.fill();x.fillRect(16,26,32,5);
  x.fillStyle='#12161b';x.fillRect(21,29,22,7);
  return c.toDataURL();
}
const PFACE={me:pilotFace('#f4f6f8'),foe:pilotFace('#e0485a')};
const portraitOf=u=>u.pilot?PFACE[u.team==='foe'?'foe':'me']:PORT[NAMES[u.row]]||PORT.Asalto;
const COST={Explorador:40,Asalto:60,Francotirador:70,Pesado:90,Artillero:80,Piloto:15},LEASH=5;
function convert(n,t){
  n.team=t;n.c=new THREE.Color(n.pilot?(t==='me'?0xffffff:COL.foe):(t==='me'?COL.me:COL.foe));
  if(n.pilot){n.body.material.map=PTEX[t];n.body.material.needsUpdate=true}
  n.bg.visible=n.fill.visible=true;n.acted=n.moved=true;face(n,t==='me'?1:-1,0);shade(n);
}
function drawBase(b){
  if(b.deco)scene.remove(b.deco);
  const g=new THREE.Group(),col=b.team==='me'?0xf2a93b:0xe0485a,tint=b.team==='me'?0x3b3320:0x3d2229;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)flat(.96,.96,tint,b.x+dx,b.y+dy,.012,g);
  flat(.8,.8,col,b.x,b.y,.014,g);flat(.6,.6,0x12161b,b.x,b.y,.016,g);flat(.34,.34,col,b.x,b.y,.018,g);
  b.deco=g;scene.add(g);
}
function captureBase(b){
  b.team='me';const got=b.res;res+=got;b.res=0;
  const n=units.filter(u=>u.alive&&u.team==='foe'&&u.home===b.id);n.forEach(u=>convert(u,'me'));
  drawBase(b);log(`¡Base ${b.id} capturada! +${got} recursos y ${n.length} unidades se unen.`);
}
function placeRaid(R){
  const my={id:0,base:true,alive:true,x:2,y:H>>1,team:'me',res:0};bases=[my];
  const x0=Math.floor(W*.4);
  for(let i=1;i<=R.nb;i++)for(let t=0,min=8;t<800;t++){
    if(t%200===199)min=Math.max(4,min-2);
    const x=x0+rnd(W-x0-3),y=2+rnd(H-4);
    if(bases.every(b=>Math.abs(b.x-x)+Math.abs(b.y-y)>=min)){bases.push({id:i,base:true,alive:true,x,y,team:'foe',res:40+rnd(41)});break}
  }
  bases.forEach(b=>{for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)RSV.add(key(b.x+dx,b.y+dy))});
  units.forEach(u=>{
    const b=u.team==='me'?my:(bases[u.home]||bases[bases.length-1]);if(u.team==='foe')u.home=b.id;
    const c=[];for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){const x=b.x+dx,y=b.y+dy;if((dx||dy)&&x>=0&&y>=0&&x<W&&y<H&&!units.some(o=>o.x===x&&o.y===y))c.push([x,y])}
    [u.x,u.y]=c[rnd(c.length)];
  });
}
function buildUnit(n){
  const b=bases.filter(b=>b.team==='me')[ST.bsel||0];if(!b||res<COST[n]||busy||!playerTurn)return;
  const sp=[];
  for(let r=1;r<=3&&!sp.length;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
    const x=b.x+dx,y=b.y+dy,t=terr.get(key(x,y));
    if(Math.max(Math.abs(dx),Math.abs(dy))===r&&x>=0&&y>=0&&x<W&&y<H&&!at(x,y)&&!isWall(x,y)&&!(t&&(t.t==='mine'||t.t==='tp')))sp.push([x,y]);
  }
  if(!sp.length){log('No hay espacio junto a la base.');return}
  const [x,y]=sp[rnd(sp.length)];res-=COST[n];
  const s=n==='Piloto'?pilotSpec():presetSpec(n),u={...s,team:'me',max:s.hp,alive:true,acted:true,moved:true,x,y};
  units.push(u);makeMech(u);log(`Construiste: ${n}.`);menu('build');paint();

renderer.domElement.addEventListener('pointerdown',async e=>{
  if(busy||over||!playerTurn||!$('ov').classList.contains('hide'))return;
  const r=renderer.domElement.getBoundingClientRect();
  const v=new THREE.Vector3((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1,0).unproject(cam);
  const x=Math.floor(v.x+W/2),y=Math.floor(H/2-v.y);
  if(x<0||y<0||x>=W||y>=H)return;
  if(tmode){await resolveTarget(x,y);return}
  const u0=at(x,y),u=u0&&isSeen(u0)?u0:null;
  if(u&&u.team==='me'){select(u);return}
  if(sel&&u&&pil.includes(u)){await (sel.pilot?board:pilot)(sel,u);select(sel.alive?sel:null);autoEnd();return}
  if(sel&&u&&targets.includes(u)){
    await attack(sel,u);sel.acted=true;sel.moved=true;shade(sel);
    if(checkEnd())return;select(sel);autoEnd();return;
  }
  const c=sel&&!sel.acted&&moveMap.get(key(x,y));
  if(c){await moveTo(sel,c);sel.moved=true;if(checkEnd())return;select(sel.alive?sel:null);return}
  const bb=!u&&bases.find(b=>Math.abs(b.x-x)<=1&&Math.abs(b.y-y)<=1);

  select(null);
});

async function endTurn(){

    if(over)return;

    let inR=vis();
    if(!inR.length&&!(RAID&&e.home!=null&&Math.min(...foes.map(f=>dist(e,f)))>LEASH+7)){
      const neu=units.filter(n=>n.alive&&n.team==='none');
      if(neu.length&&(e.pilot||extras.foe<3)&&Math.random()<(e.pilot?0.95:0.75)){
        let nn=neu.find(n=>dist(e,n)===1);
        if(!nn)for(const c of reach(e).values()){
          const t=terr.get(key(c.x,c.y));if(t&&t.t==='mine')continue;
          const n=neu.find(n=>Math.abs(n.x-c.x)+Math.abs(n.y-c.y)===1);
          if(n){await moveTo(e,c);nn=n;break}

      }
      const goN=e.pilot&&neu.length,fl=(goN?neu:foes).map(field),dn=(x,y)=>Math.min(...fl.map(m=>m.get(key(x,y))??99));
      let best=null,bs=dn(e.x,e.y),bt=false;

        const t=terr.get(key(c.x,c.y));if(t&&t.t==='mine')continue;
        if(RAID&&e.home!=null&&bases[e.home]&&Math.abs(c.x-bases[e.home].x)+Math.abs(c.y-bases[e.home].y)>LEASH)continue;
        const sh=!goN&&foes.some(f=>canHit(e,c.x,c.y,f)),s=dn(c.x,c.y);
        if(sh?(!bt||s>bs):(!bt&&s<bs)){best=c;bs=s;bt=sh}
      }
      if(best)await moveTo(e,best);
      inR=vis();
    }
    if(inR.length){await attack(e,inR.sort((a,b)=>(a.pilot?-999:0)+a.hp-((b.pilot?-999:0)+b.hp))[0]);if(checkEnd())return}
    await tween(120,()=>{});
  }

  log(`Turno ${turnN}: tu mando.`);ui();
}

function stat(k,el){const m=lab(),o=m[k];m[k]=+el.value;if(!ST.nl&&cost(m)>BUD+1e-9){m[k]=o;el.value=o}$('v_'+k).textContent=m[k];bud()}
const bud=()=>{const el=$('bud');if(el)el.textContent=ST.nl?'Sin límite de puntos (sandbox)':`Puntos de diseño ${cost(lab()).toFixed(1)} / ${BUD}`};
function setNL(v){ST.nl=v;if(!v)ST.lab.forEach(m=>{if(cost(m)>BUD+1e-9||m.hp>200||m.mv>6||m.rng>7||m.dmg>50)Object.assign(m,{hp:100,mv:3,rng:3,dmg:25})});menu('lab')}
const sl=(lbl,a,b,st,val,code,suf='')=>`<label class="row">${lbl} <input type="range" min="${a}" max="${b}" step="${st}" value="${val}" oninput="${code};this.nextElementSibling.textContent=this.value+'${suf}'"><span>${val}${suf}</span></label>`;
const ck=(lbl,key)=>`<label class="row">${lbl} <input type="checkbox" ${ST[key]?'checked':''} onchange="ST.${key}=this.checked;menu('lab')"></label>`;
const chipSel=(cur,code)=>`<select onchange="${code}"><option value="">— ninguno —</option>${chipIds().map(id=>`<option value="${id}" ${id===cur?'selected':''}>${ITEMS[id].name}</option>`).join('')}</select>`;
const SCR={
 home:()=>`<h2>Frente de Acero</h2><p>Elige cómo armar tu escuadrón. Controlas de 1 a 5 mechas y el enemigo trae de 1 a 5.</p>
  <button class="mode" onclick="menu('squad')"><b>Escuadrón</b><span>Escoge el tipo de cada mecha que llevas a la batalla.</span></button>
  <button class="mode" onclick="menu('random')"><b>Aleatorio</b><span>Cantidad, tipos y posiciones sorteados para ambos bandos.</span></button>
  <button class="mode" onclick="menu('lab')"><b>Taller</b><span>Sandbox: diseña mechas, equípales chips y objetos, y configura enemigos, mapa y reglas.</span></button>
  <button class="mode" onclick="menu('raid')"><b>Raid</b><span>Captura bases enemigas, reúne recursos y construye mechas y soldados.</span></button>
  <button class="mode" onclick="menu('hangar')"><b>Hangar</b><span>Equipa chips de mejora a tus mechas. Se conservan entre misiones.</span></button>
  <button class="mode" onclick="menu('shop')"><b>Tienda</b><span>Compra consumibles y chips con tus créditos (${PROFILE.credits}).</span></button>
  ${inGame&&!over?`<button class="ghost" onclick="$('ov').classList.add('hide')">Volver a la partida</button>`:''}`,
 squad:()=>`<h2>Escuadrón</h2><p>Elige hasta 5 mechas. Deja vacíos los espacios que no uses.</p>`+
  ST.squad.map((t,i)=>`<label class="row">Mecha ${i+1}<select onchange="ST.squad[${i}]=this.value||null;menu('squad')"><option value="">— vacío —</option>${NAMES.map(n=>`<option ${n===t?'selected':''}>${n}</option>`).join('')}</select></label>${t?`<small>${statLine(presetSpec(t))}</small>`:''}`).join('')+
  `<label class="row">Enemigos ${count('',ST.foeN,"ST.foeN=+this.value")}</label>
  <label class="row">Mapa ${sizeSel(ST.sizeS,"ST.sizeS=this.value")}</label>
  <div class="acts"><button class="ghost" onclick="menu('home')">Volver</button><button ${ST.squad.some(Boolean)?'':'disabled'} onclick="launch(BUILD.squad)">Desplegar</button></div>`,
 random:()=>`<h2>Aleatorio</h2><p>Elige cuántos mechas por bando (1 a 5) o deja que el azar decida. Tipos y posiciones se sortean en todo el campo.</p>
  <label class="row">Tus mechas ${count('',ST.rp,"ST.rp=+this.value")}</label>
  <label class="row">Enemigos ${count('',ST.re,"ST.re=+this.value")}</label>
  <label class="row">Mapa ${sizeSel(ST.sizeR,"ST.sizeR=this.value",1)}</label>
  <label class="row">Pilotos sueltos (prob.) <input type="range" min="0" max="100" step="10" value="${ST.pp}" oninput="ST.pp=+this.value;this.nextElementSibling.textContent=this.value+'%'"><span>${ST.pp}%</span></label>
  <div class="acts"><button class="ghost" onclick="menu('home')">Volver</button>
  <button class="ghost" onclick="launch(BUILD.random)">Cantidades al azar</button>
  <button onclick="launch(()=>({free:true,size:mapSize(ST.sizeR),neutral:randSpecs(rnd(4)),mine:[...randSpecs(ST.rp),...pilotsP()],foes:[...randSpecs(ST.re),...pilotsP()]}))">Sortear</button></div>`,
 lab:()=>{
  const m=lab(),T=ST.lt,nl=ST.nl;
  const tabs=[['mech','Mechas'],['foe','Enemigos'],['map','Mapa'],['place','Colocar'],['rules','Reglas'],['inv','Objetos'],['cfg','Guardados']];
  let b='';
  if(T==='mech'){
    const R=nl?{hp:[20,500,10],mv:[1,12,1],rng:[1,12,1],dmg:[5,120,5]}:{hp:[40,200,10],mv:[1,6,1],rng:[1,7,1],dmg:[10,50,5]};
    b=`<div class="tabs">${ST.lab.map((x,i)=>`<button class="${i===ST.ls?'on ':''}${x.on?'act':''}" onclick="ST.ls=${i};menu('lab')">${x.on?'●':'○'} ${i+1}</button>`).join('')}</div>
    <label class="row">Incluir en el escuadrón <input type="checkbox" ${m.on?'checked':''} onchange="lab().on=this.checked;menu('lab')"></label>
    <label class="row">Color <input type="color" value="${m.color}" oninput="lab().color=this.value"></label>
    ${sl('Tamaño',.6,1.3,.05,m.size,'lab().size=+this.value')}
    <label class="row">Arma <select onchange="lab().weapon=this.value">${Object.entries(WEAP).map(([k,v])=>`<option value="${k}" ${k===m.weapon?'selected':''}>${v}</option>`).join('')}</select></label>
    <small>Cañón: disparo estándar · Láser: rayo directo · Ametralladora: ráfaga · Misiles: daño en área</small>
    ${[['hp','Blindaje'],['mv','Movimiento'],['rng','Alcance'],['dmg','Daño']].map(([k,n])=>`<label class="row">${n} <input type="range" min="${R[k][0]}" max="${R[k][1]}" step="${R[k][2]}" value="${m[k]}" oninput="stat('${k}',this)"><span id="v_${k}">${m[k]}</span></label>`).join('')}
    <div id="bud">${nl?'Sin límite de puntos (sandbox)':`Puntos de diseño ${cost(m).toFixed(1)} / ${BUD}`}</div>
    <label class="row">Chip de mejora ${chipSel(m.chip,"lab().chip=this.value||null;menu('lab')")}</label>${m.chip?`<small>${modsText(ITEMS[m.chip])}</small>`:''}
    ${sl('Cargas de escudo iniciales',0,3,1,m.sh,'lab().sh=+this.value')}
    ${sl('Energía inicial',0,100,10,m.en,'lab().en=+this.value')}
    ${stBox(m.st,'lab',ST.ls)}
    <details><summary>Estadísticas avanzadas</summary>
    ${sl('Precisión',50,150,5,m.acc,'lab().acc=+this.value','%')}${sl('Evasión',0,80,5,m.eva,'lab().eva=+this.value','%')}
    ${sl('Defensa',0,30,1,m.def,'lab().def=+this.value')}${sl('Reducción de daño',0,60,5,m.red,'lab().red=+this.value','%')}
    ${sl('Iniciativa',1,15,1,m.init??(2+m.mv),'lab().init=+this.value')}</details>`;
  }else if(T==='foe'){
    b=`<label class="row">Enemigos ${count('',ST.labFoe,"ST.labFoe=+this.value;menu('lab')")}</label>`+
    Array.from({length:ST.labFoe},(_,i)=>{const e=ST.le[i]||(ST.le[i]={});return `<label class="row">Enemigo ${i+1} <select onchange="ST.le[${i}].type=this.value||null"><option value="">Aleatorio</option>${NAMES.map(n=>`<option ${n===e.type?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="row">Chip ${chipSel(e.chip,`ST.le[${i}].chip=this.value||null`)}</label>${stBox(e.st,'le',i)}`}).join('')+
    sl('Dificultad (blindaje y daño)',50,300,10,ST.ld,'ST.ld=+this.value','%');
  }else if(T==='map'){
    b=sl('Ancho del mapa',10,24,1,ST.mw,'ST.mw=+this.value')+sl('Alto del mapa',8,16,1,ST.mh,'ST.mh=+this.value')+
    [['wall','Muros'],['mud','Lodo'],['mine','Minas'],['rep','Reparación'],['tp','Teletransportadores']].map(([k,n])=>sl(n,0,k==='tp'?300:200,10,ST.td[k],`ST.td.${k}=+this.value`,'%')).join('')+
    ck('Niebla de guerra','fog')+'<small>Mapa desde 10×8 hasta 24×16. La densidad del terreno va de 0% (ninguno) a 200%.</small>';
  }else if(T==='rules'){
    b=sl('Captura al derrotar',0,100,10,ST.cap,'ST.cap=+this.value','%')+sl('Piloto sobrevive',0,100,10,ST.ps,'ST.ps=+this.value','%')+
    sl('Robots sin piloto',0,6,1,ST.labN,'ST.labN=+this.value')+sl('Tus pilotos sin mecha',0,3,1,ST.lpm,'ST.lpm=+this.value')+sl('Pilotos enemigos sin mecha',0,3,1,ST.lpe,'ST.lpe=+this.value')+
    ck('Sin límite de puntos de diseño','nl').replace("ST.nl=this.checked;menu('lab')","setNL(this.checked)")+ck('Objetos ilimitados','unl')+ck('Energía infinita','inf')+ck('Enemigos pasivos (no actúan)','pas')+ck('Estados iniciales permanentes','permFx')+
    '<small>Los chips y objetos del Taller no gastan tu perfil ni dan recompensas.</small>';
  }else if(T==='place'){
    const ks=pKeys(),at2={};ks.forEach(([k])=>{const p=ST.pos[k];if(p&&p[0]<ST.mw&&p[1]<ST.mh)at2[p[0]+','+p[1]]=k});
    if(!ks.some(a=>a[0]===ST.pe))ST.pe=ks[0][0];
    const lab2=k=>k[0]==='m'?'M'+(+k[1]+1):k[0]==='e'?'E'+(+k[1]+1):'P';
    const cls=k=>k.startsWith('pm')?'pm':k.startsWith('pe')?'pe':k[0];
    b=`<label class="row">Unidad ${'<select onchange="ST.pe=this.value;menu(\'lab\')">'+ks.map(([k,n])=>`<option value="${k}" ${k===ST.pe?'selected':''}>${n}${ST.pos[k]?' ✓':''}</option>`).join('')+'</select>'}</label>
    <div class="pgrid" style="grid-template-columns:repeat(${ST.mw},1fr)">${Array.from({length:ST.mw*ST.mh},(_,i)=>{const x=i%ST.mw,y=(i/ST.mw)|0,k=at2[x+','+y];return `<button class="pc ${k?cls(k)+(k===ST.pe?' sel':''):''}" onclick="placeAt(${x},${y})" aria-label="Casilla ${x},${y}">${k?lab2(k):''}</button>`}).join('')}</div>
    <small>Elige una unidad y toca una casilla vacía para colocarla. Toca una unidad del mapa para elegirla; tócala de nuevo para quitarle la posición. Las unidades sin posición se colocan solas. El terreno se genera al desplegar.</small>
    <div class="acts"><button class="ghost" onclick="ST.pos={};menu('lab')">Borrar todas las posiciones</button></div>`;
  }else if(T==='cfg'){
    const d=readLabStore();
    b=`<label class="row">Nombre <input type="text" id="labname" maxlength="30" placeholder="Mi configuración"></label>
    <div class="acts"><button onclick="labSave()">Guardar configuración actual</button></div>`+
    (d.items.length?d.items.map((x,i)=>`<div class="row"><span style="text-align:left;flex:1;color:var(--tx)">${esc(x.name)}</span><button class="ghost" onclick="labLoad(${i})">Cargar</button><button class="ghost" onclick="labDel(${i})">Borrar</button></div>`).join(''):'<small>Aún no hay configuraciones guardadas.</small>')+
    `<details><summary>Exportar / importar</summary><textarea id="labtxt" rows="5" placeholder="Pega aquí una configuración"></textarea><div class="acts"><button class="ghost" onclick="labExport()">Exportar</button><button class="ghost" onclick="labImport()">Importar</button></div><small id="labmsg"></small></details>
    <small>La última configuración desplegada se recuerda automáticamente.</small>`;
  }else{
    b=`<div class="acts"><button class="ghost" onclick="consumables().forEach(i=>ST.linv[i.id]=9);menu('lab')">Todo ×9</button><button class="ghost" onclick="consumables().forEach(i=>ST.linv[i.id]=0);menu('lab')">Vaciar</button></div>`+
    consumables().map(i=>`<label class="row"><span style="text-align:left;min-width:0;flex:1;color:${RARITY[i.rarity].c}">${i.name}</span><input type="range" min="0" max="9" value="${ST.linv[i.id]||0}" oninput="ST.linv['${i.id}']=+this.value;this.nextElementSibling.textContent=this.value"><span>${ST.linv[i.id]||0}</span></label>`).join('')+
    '<small>Inventario de esta partida. Con un mecha seleccionado, sus iconos aparecen abajo a la izquierda.</small>';
  }
  return `<h2>Taller</h2><p>Sandbox: diseña tu escuadrón, equípalo, configura al enemigo, el mapa y las reglas.</p><div class="tabs wrap">${tabs.map(([k,n])=>`<button class="${k===T?'on':''}" onclick="ST.lt='${k}';menu('lab')">${n}</button>`).join('')}</div>${b}
  <div class="acts"><button class="ghost" onclick="menu('home')">Volver</button><button ${ST.lab.some(x=>x.on)?'':'disabled'} onclick="launch(BUILD.lab)">Desplegar</button></div>`},
 raid:()=>`<h2>Raid</h2><p>Captura todas las bases enemigas pisando su núcleo. Te quedas con sus mechas, pilotos y recursos. Ganas recursos al destruir enemigos y al conectar depósitos, y los usas para construir. El enemigo defiende su zona: no construye ni recolecta.</p>
  <label class="row">Mapa <select onchange="ST.sizeX=this.value">${['M','L','XL'].map(k=>`<option value="${k}" ${k===ST.sizeX?'selected':''}>${SIZES[k].n}</option>`).join('')}</select></label>`+
  [['Bases enemigas',2,4,'rb'],['Mechas por base',1,3,'rpb'],['Pilotos por base',0,2,'rpp'],['Tus mechas',1,5,'rmn'],['Tus pilotos',0,3,'rpl']].map(([n,a,b,k])=>`<label class="row">${n} <input type="range" min="${a}" max="${b}" value="${ST[k]}" oninput="ST.${k}=+this.value;this.nextElementSibling.textContent=this.value"><span>${ST[k]}</span></label>`).join('')+
  `<label class="row">Recursos iniciales <input type="range" min="0" max="300" step="25" value="${ST.rr}" oninput="ST.rr=+this.value;this.nextElementSibling.textContent=this.value"><span>${ST.rr}</span></label>
  <div class="acts"><button class="ghost" onclick="menu('home')">Volver</button><button onclick="launch(BUILD.raid)">Desplegar</button></div>`,
 build:()=>{
  const mine=bases.filter(b=>b.team==='me');ST.bsel=Math.min(ST.bsel||0,mine.length-1);
  const items=[...NAMES.map(n=>[n,COST[n],statLine(presetSpec(n))]),['Piloto',COST.Piloto,`Soldado: ataque ${PIL.vsMech}/${PIL.vsPilot}, puede abordar robots sin piloto`]];
  return `<h2>Construir</h2><p>Recursos: <b style="color:var(--me)">${res}</b>. La unidad aparece junto a la base elegida y actúa el turno siguiente.</p>
  <label class="row">Base <select onchange="ST.bsel=+this.value;menu('build')">${mine.map((b,i)=>`<option value="${i}" ${i===ST.bsel?'selected':''}>${b.id===0?'Principal':'Capturada '+b.id} (${b.x},${b.y})</option>`).join('')}</select></label>`+
  items.map(([n,c,d])=>`<button class="mode" ${res<c?'disabled':''} onclick="buildUnit('${n}')"><b>${n} · ${c}</b><span>${d}</span></button>`).join('')+
  `<div class="acts"><button onclick="$('ov').classList.add('hide')">Cerrar</button></div>`},
 hangar:()=>`<h2>Hangar</h2><p>Un chip de mejora por mecha. Puedes desmontarlos e intercambiarlos entre mechas; se conservan entre misiones. El mecha 1 es el primero que despliegues, y así sucesivamente.</p>`+
  PROFILE.eq.map((c,i)=>`<label class="row">Mecha ${i+1} <select onchange="equip(${i},this.value)"><option value="">— sin chip —</option>${chipIds().map(id=>{const av=chipAvail(id,i);return `<option value="${id}" ${id===c?'selected':''} ${av<1&&id!==c?'disabled':''}>${ITEMS[id].name} (${av})</option>`}).join('')}</select></label>${c?`<small>${modsText(ITEMS[c])}</small>`:''}`).join('')+
  `<p style="margin-top:14px">Consumibles: ${consumables().filter(i=>stock(i.id)).map(i=>`${i.name} ×${stock(i.id)}`).join(', ')||'ninguno'}.</p>
  <div class="acts"><button onclick="menu('home')">Volver</button></div>`,
 shop:()=>`<h2>Tienda</h2><p>Créditos: <b style="color:var(--me)">${PROFILE.credits}</b>. Ganas créditos al terminar cada misión y las compras se guardan en tu perfil.</p>`+
  shopList().map(i=>`<button class="mode item" ${PROFILE.credits<i.price?'disabled':''} onclick="buy('${i.id}')"><img src="${iconOf(i.id)}" alt=""><span><b>${i.name} · ${i.price}</b><em style="color:${RARITY[i.rarity].c}">${RARITY[i.rarity].n} · ${i.type==='chip'?'Chip de mejora':'Consumible'} · tienes ${stock(i.id)}</em><span>${i.type==='chip'?modsText(i):i.desc}</span></span></button>`).join('')+
  `<div class="acts"><button onclick="menu('home')">Volver</button></div>`,
 end:win=>`<h2>${win?'Victoria':'Escuadrón destruido'}</h2><p>${win?`${RAID?'Capturaste todas las bases enemigas':'Eliminaste a todos los enemigos'} en el turno ${turnN}.`:'Todos tus mechas cayeron. Prueba otra formación.'}${SBX.on?'<br>Modo sandbox: sin recompensas.':`<br>Recompensa: <b>+${lastReward}</b> créditos.${dropsLog.length?`<br>Botín: ${dropsLog.join(', ')}.`:''}`}</p>
  <div class="acts"><button class="ghost" onclick="menu('home')">Menú</button><button onclick="launch(lastBuild)">Reintentar</button></div>`};
function menu(s,arg){$('card').innerHTML=SCR[s](arg);$('ov').classList.remove('hide');ui()}
loadLast();resize();menu('home');requestAnimationFrame(loop);
</script>
</body>
</html>
